name: publish

# Pushing a tag vX.Y.Z builds cyberrakshak-monitor X.Y.Z, tests the wheel, and publishes it to PyPI by trusted
# publishing (OIDC): no PyPI token is stored anywhere. PyPI's (pending) publisher names this repository, this workflow
# file (publish.yml) and the environment "pypi".

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag is pyproject.toml's version
        run: |
          python - <<'PY'
          import os, re
          version = re.search(r'^version = "([^"]+)"$', open("pyproject.toml", encoding="utf-8").read(), re.M).group(1)
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert version == tag, "pyproject.toml says %s, the tag is %s" % (version, tag)
          PY
      - run: python -B -m unittest discover -s tests -v
      - run: python -m pip install build
      - run: python -m build
      - run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          CR_TEST_INSTALLED=1 /tmp/venv/bin/python -B -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cyberrakshak-monitor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
