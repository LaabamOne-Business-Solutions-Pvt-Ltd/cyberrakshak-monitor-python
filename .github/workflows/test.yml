name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    # The tests talk to tests/fake-server.mjs (127.0.0.1 only), which needs Node.js.
    name: 'Python ${{ matrix.python }} on ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - { os: windows-latest, python: '3.12' }
          - { os: macos-latest, python: '3.12' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -B -m unittest discover -s tests -v

  wheel:
    name: Build, then test the installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install build
      - run: python -m build
      - name: The wheel holds the one module, byte for byte
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          names = sorted(n for n in wheel.namelist() if ".dist-info/" not in n)
          assert names == ["cyberrakshak_monitor.py"], names
          assert wheel.read("cyberrakshak_monitor.py") == open("src/cyberrakshak_monitor.py", "rb").read()
          print("ok:", names)
          PY
      - run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          CR_TEST_INSTALLED=1 /tmp/venv/bin/python -B -m unittest discover -s tests -v
